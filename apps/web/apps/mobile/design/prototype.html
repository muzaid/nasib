<title>نصيب — نموذج التطبيق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap">

<style>
:root {
  /* White page, white panels, and a hairline to separate them. Contrast is
     the whole point of this palette: the previous cream reads warm but it
     costs about a third of the ink-to-ground contrast, and Arabic loses
     more from that than Latin does. */
  --page:       #F6F9FB;
  --panel:      #FFFFFF;
  --panel-2:    #EFF4F8;
  --line:       #DDE5EB;

  --ink:        #0F2033;   /* deep navy — 14:1 on white */
  --ink-soft:   #44586B;
  --muted:      #7C8FA0;

  --teal:       #0E7C7B;   /* the one action colour */
  --teal-deep:  #0A5F5E;
  --teal-soft:  #E2F1F1;

  /* A second, darker navy for the ornament and section marks. Two colours
     only: one for ink and structure, one for anything you can press. */
  --accent:     #14527A;
  --accent-soft:#E6EFF6;

  --verified:   #0F7A57;
  --caution:    #A85C00;
  --danger:     #B3261E;

  --shell:      #E8EEF3;
  --shell-ink:  #5E7183;

  /* Tokens rather than overrides. A colour whose only definition sits
     behind a :root[data-theme] selector applies in the un-stamped state
     too, which is how a page ends up rendering one theme's ink on the
     other theme's ground. */
  --veil-a:     #DCE6ED;
  --veil-b:     #C2D2DE;
  --veil-on-a:  #AFC1D0;
  --veil-on-b:  #91A6B8;
  --on-teal:    #FFFFFF;

  --ar: "Cairo", "Noto Sans Arabic", ui-sans-serif, system-ui, sans-serif;
  --display: "Cairo", "Noto Sans Arabic", ui-sans-serif, system-ui, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page:       #0C141B;
    --panel:      #121C25;
    --panel-2:    #18242F;
    --line:       #24323E;
    --ink:        #E8F0F6;
    --ink-soft:   #A7B8C6;
    --muted:      #78899A;
    --teal:       #4FD1C5;
    --teal-deep:  #6FE0D5;
    --teal-soft:  #10292B;
    --accent:     #7FB2DC;
    --accent-soft:#132532;
    --verified:   #5FC79B;
    --caution:    #D99A4E;
    --danger:     #E68B84;
    --shell:      #070C11;
    --shell-ink:  #7A8B9B;
    --veil-a: #1E2C37; --veil-b: #17232C;
    --veil-on-a: #33485A; --veil-on-b: #263846;
    --on-teal: #06211F;
  }
}

:root[data-theme="dark"] {
  --page: #0C141B; --panel: #121C25; --panel-2: #18242F; --line: #24323E;
  --ink: #E8F0F6; --ink-soft: #A7B8C6; --muted: #78899A;
  --teal: #4FD1C5; --teal-deep: #6FE0D5; --teal-soft: #10292B;
  --accent: #7FB2DC; --accent-soft: #132532;
  --verified: #5FC79B; --caution: #D99A4E; --danger: #E68B84;
  --shell: #070C11; --shell-ink: #7A8B9B;
  --veil-a: #1E2C37; --veil-b: #17232C;
  --veil-on-a: #33485A; --veil-on-b: #263846;
  --on-teal: #06211F;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--shell);
  color: var(--ink);
  font-family: var(--ar);
  direction: rtl;
  text-align: right;
  -webkit-font-smoothing: antialiased;
}

/* ---------------- page frame ---------------- */

.page { padding: 28px 16px 56px; max-width: 1180px; margin: 0 auto; }

.masthead { text-align: center; margin-bottom: 26px; }
.masthead h1 {
  font-family: var(--display);
  font-size: 38px; font-weight: 700; margin: 0; letter-spacing: -.01em;
  color: var(--ink); line-height: 1.4;
}
.masthead p { margin: 4px 0 0; color: var(--shell-ink); font-size: 14.5px; }

/* the screen picker */
.tabs {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  margin: 22px auto 26px; max-width: 900px;
}
.tab {
  font: inherit; font-size: 14px; font-weight: 600;
  padding: 8px 15px; border-radius: 999px; cursor: pointer;
  background: transparent; color: var(--shell-ink);
  border: 1px solid transparent;
}
.tab:hover { color: var(--ink); border-color: var(--line); }
.tab[aria-selected="true"] {
  background: var(--panel); color: var(--ink); border-color: var(--line);
}
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.stage { display: flex; justify-content: center; }

/* the device */
.device {
  width: 390px; max-width: 100%;
  border-radius: 46px;
  background: var(--panel);
  border: 10px solid #1B2836;
  box-shadow: 0 30px 70px rgba(0,0,0,.28), 0 2px 0 rgba(255,255,255,.04) inset;
  overflow: hidden;
  position: relative;
}
:root[data-theme="dark"] .device,
:root:not([data-theme="light"]) .device { border-color: #223140; }

.notch {
  position: absolute; top: 9px; inset-inline: 0; margin: auto;
  width: 108px; height: 24px; border-radius: 999px;
  background: #1B2836; z-index: 5;
}
:root[data-theme="dark"] .notch,
:root:not([data-theme="light"]) .notch { background: #223140; }

.viewport {
  height: 780px; overflow-y: auto; overflow-x: hidden;
  background: var(--page);
  scrollbar-width: thin;
}
.viewport::-webkit-scrollbar { width: 0; }

.statusbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 22px 2px; font-size: 12px; color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.statusbar .right { display: flex; gap: 5px; align-items: center; }

.screen { display: none; padding: 0 0 34px; min-height: 100%; }
.screen[data-active="true"] { display: block; }

.pad { padding-inline: 26px; }

/* ---------------- shared pieces ---------------- */

.appbar {
  display: grid; grid-template-columns: 30px 1fr auto; align-items: center;
  gap: 10px; padding: 10px 18px 14px;
}
.appbar h2 { margin: 0; font-size: 17.5px; font-weight: 700; text-align: center; }
.appbar .icon { color: var(--ink); opacity: .75; }
.appbar .side { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }

.progress { height: 3px; background: var(--line); margin: 0 18px 20px; border-radius: 2px; }
.progress i { display: block; height: 100%; background: var(--teal); border-radius: 2px; }

h3.hd { font-size: 25px; font-weight: 700; margin: 0 0 6px; line-height: 1.45; }
p.sub { margin: 0 0 22px; color: var(--ink-soft); font-size: 14.5px; line-height: 1.8; }
p.body { font-size: 16.5px; line-height: 1.95; margin: 0 0 16px; }
p.note { font-size: 14px; line-height: 1.8; color: var(--ink-soft); margin: 10px 0 0; }

.eyebrow {
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; font-weight: 700; letter-spacing: .02em;
  color: var(--ink-soft); margin: 0 0 10px;
}
.eyebrow::before { content: ""; width: 14px; height: 2px; background: var(--teal); flex: none; }

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 18px;
  box-shadow: 0 6px 18px rgba(15,32,51,.05);
}
.panel + .panel { margin-top: 14px; }
.panel.tinted { background: var(--teal-soft); }
.panel.accent { border-inline-start: 3px solid var(--teal); }
.panel.accent-alt { border-inline-start: 3px solid var(--accent); }
.panel.flat { box-shadow: none; }

.rule { height: 1px; background: var(--line); border: 0; margin: 14px 0; }

.ornament { display: flex; align-items: center; gap: 10px; justify-content: center; margin: 22px 0; }
.ornament .bar { height: 1px; width: 46px; background: var(--accent-soft); }

.btn {
  display: block; width: 100%; font: inherit; font-size: 16px; font-weight: 600;
  padding: 16px; border-radius: 14px; border: 0; cursor: pointer;
  background: var(--teal); color: var(--on-teal);
}
.btn.ghost { background: transparent; color: var(--ink); border: 1.2px solid var(--line); }
.btn.quiet { background: transparent; color: var(--teal); border: 0; font-size: 14.5px; padding: 10px; }
.btn.danger { background: transparent; color: var(--danger); border: 1.2px solid var(--danger); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }
.btn-row .btn.wide { flex: 2; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 13px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel);
  font-size: 14.5px; font-weight: 500; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--teal-soft); border-color: var(--teal); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px 5px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 600;
}
.badge.id { color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 55%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
.badge.photo { color: var(--teal); background: color-mix(in srgb, var(--teal-soft) 70%, transparent); border: 1px solid color-mix(in srgb, var(--teal) 28%, transparent); }

.fact { display: inline-flex; padding: 7px 13px; border-radius: 999px;
        border: 1px solid var(--line); background: var(--panel); font-size: 14px; font-weight: 500; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }

.kv { display: flex; gap: 12px; padding: 9px 0; }
.kv dt { width: 100px; flex: none; color: var(--ink-soft); font-size: 14px; }
.kv dd { margin: 0; font-size: 15.5px; font-weight: 600; }

.line-item { display: flex; gap: 13px; align-items: flex-start; padding: 14px 0; }
.line-item + .line-item { border-top: 1px solid var(--line); }
.line-item svg { flex: none; margin-top: 2px; }
.line-item span { font-size: 16px; line-height: 1.85; }

/* veiled photos — a decision, not a failed load */
.veil-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.veil-row::-webkit-scrollbar { display: none; }
.veil {
  width: 150px; height: 196px; flex: none;
  border-radius: 18px; border: 1px solid var(--line);
  background: linear-gradient(215deg, var(--veil-a), var(--veil-b));
  display: grid; place-items: center; position: relative; overflow: hidden;
}
.veil.revealed { background: linear-gradient(215deg, var(--veil-on-a), var(--veil-on-b)); }
.veil .wm {
  position: absolute; bottom: 8px; inset-inline-end: 10px;
  font-size: 10px; font-weight: 600; color: rgba(255,255,255,.72);
  direction: ltr;
}

/* chat */
.thread { display: flex; flex-direction: column; gap: 10px; }
.bubble {
  max-width: 78%; padding: 11px 15px; border-radius: 16px;
  font-size: 16px; line-height: 1.8;
}
.bubble.them { background: var(--panel); border: 1px solid var(--line); align-self: flex-end; }
.bubble.me { background: var(--teal); color: var(--on-teal); align-self: flex-start; }
.bubble small { display: block; margin-top: 5px; font-size: 11px; opacity: .8; }

.banner {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 13px 15px; border-radius: 14px; font-size: 14.5px; line-height: 1.8;
}
.banner.info { background: var(--teal-soft); color: var(--ink); }
.banner.warn { background: color-mix(in srgb, var(--caution) 12%, transparent); color: var(--caution); }

.composer {
  display: flex; gap: 9px; align-items: center;
  padding: 12px 18px 4px;
}
.composer .box {
  flex: 1; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 13px 15px; color: var(--muted); font-size: 14.5px;
}
.composer .send {
  width: 46px; height: 46px; border-radius: 14px; border: 0;
  background: var(--teal); color: var(--on-teal); cursor: pointer;
  display: grid; place-items: center;
}

.grant {
  display: flex; align-items: center; gap: 12px; padding: 14px 0;
}
.grant + .grant { border-top: 1px solid var(--line); }
.grant .who { flex: 1; min-width: 0; }
.grant .who b { font-size: 16px; font-weight: 600; }
.grant .who span { display: block; font-size: 13.5px; color: var(--ink-soft); }
.grant button {
  font: inherit; font-size: 14.5px; font-weight: 600; color: var(--danger);
  background: transparent; border: 0; cursor: pointer; padding: 6px 4px;
}

.slot { display: flex; gap: 12px; align-items: center; padding: 13px 15px;
        border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
        margin-bottom: 8px; }

.stepdot { display: flex; align-items: center; gap: 12px; padding: 11px 0; }
.stepdot .mark { width: 20px; flex: none; display: grid; place-items: center; }

/* ---------------- guided camera capture ---------------- */

/* The ring is the viewfinder. It is deliberately not a rectangle: a face
   held at the right distance fills a circle unambiguously, where a frame
   invites the user to centre the phone instead of their face. */
.ring {
  width: 188px; height: 188px; margin: 0 auto; border-radius: 50%;
  display: grid; place-items: center; position: relative;
  background: var(--panel-2); border: 1.5px solid var(--line);
}
.ring.live { border: 3px solid var(--teal); background: var(--teal-soft); }
.ring .pulse {
  position: absolute; inset: -9px; border-radius: 50%;
  border: 1.5px solid var(--teal); opacity: .34;
  animation: breathe 2.4s ease-in-out infinite;
}
@keyframes breathe { 50% { transform: scale(1.045); opacity: .12; } }

/* Dots, not a progress bar. A bar asks to be watched, and the one thing
   this screen needs is for the user to keep looking at the lens. */
.dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 4px; }
.dots i { width: 8px; height: 8px; border-radius: 999px; background: var(--line); }
.dots i.done { background: var(--teal); }
.dots i.now { width: 22px; background: var(--teal); }

/* Left-to-right even inside an RTL screen: Arabic-Indic numerals are still
   read in that order, and bidi would otherwise hand the user the digits
   backwards — which is a spoken challenge the honest user then fails. */
.digits {
  direction: ltr; unicode-bidi: isolate;
  font-size: 34px; font-weight: 700; color: var(--teal);
  letter-spacing: 9px; text-align: center; margin: 14px 0 0;
  font-variant-numeric: tabular-nums;
}

.verdict { display: flex; gap: 12px; padding: 15px 0; align-items: flex-start; }
.verdict .mark { flex: none; width: 22px; display: grid; place-items: center; }

.notes {
  max-width: 420px; margin: 22px auto 0; color: var(--shell-ink);
  font-size: 13.5px; line-height: 1.85; text-align: center;
}

.themetoggle {
  position: fixed; top: 14px; inset-inline-start: 14px; z-index: 30;
  font: inherit; font-size: 12.5px; font-weight: 600;
  background: var(--panel); color: var(--ink-soft);
  border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 14px; cursor: pointer;
}

@media (max-width: 460px) {
  .page { padding: 18px 12px 40px; }
  .device { border-width: 0; border-radius: 0; box-shadow: none; width: 100%; }
  .notch { display: none; }
  .viewport { height: auto; min-height: 70vh; }
  .masthead h1 { font-size: 32px; }
  .themetoggle { inset-inline-start: 8px; top: 8px; }
}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<button class="themetoggle" id="themebtn" type="button">الوضع الداكن</button>

<div class="page">
  <header class="masthead">
    <h1>نصيب</h1>
    <p>نموذج تفاعلي لواجهة التطبيق — اضغط على أي شاشة</p>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="شاشات التطبيق"></nav>

  <div class="stage">
    <div class="device">
      <div class="notch" aria-hidden="true"></div>
      <div class="viewport" id="viewport">
        <div class="statusbar">
          <span>٩:٤١</span>
          <span class="right">
            <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor" aria-hidden="true"><rect x="0" y="7" width="3" height="4" rx=".6"/><rect x="4.3" y="5" width="3" height="6" rx=".6"/><rect x="8.6" y="2.6" width="3" height="8.4" rx=".6"/><rect x="12.9" y="0" width="3" height="11" rx=".6" opacity=".35"/></svg>
            <svg width="22" height="11" viewBox="0 0 22 11" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="18" height="10" rx="3" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="13" height="7" rx="1.8" fill="currentColor"/><path d="M20.4 4v3c.9-.3.9-2.7 0-3Z" fill="currentColor" opacity=".45"/></svg>
          </span>
        </div>
        <div id="screens"></div>
      </div>
    </div>
  </div>

  <p class="notes" id="screennote"></p>
</div>

<script>
/* The eight-point star: two overlaid squares, which is how the motif is
   actually constructed in Levantine tile rather than a star drawn point by
   point. Used three times in the whole app — any more and it is wallpaper. */
function star(size, color, opacity) {
  const r = size / 2, pts = [];
  for (let i = 0; i < 16; i++) {
    const rad = i % 2 === 0 ? r : r * 0.54;
    const a = (Math.PI / 8) * i - Math.PI / 2;
    pts.push(`${(r + Math.cos(a) * rad).toFixed(2)},${(r + Math.sin(a) * rad).toFixed(2)}`);
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="none" aria-hidden="true"
     style="opacity:${opacity ?? 1}"><polygon points="${pts.join(' ')}" stroke="${color}"
     stroke-width="${(size * 0.055).toFixed(2)}" stroke-linejoin="round" fill="none"/></svg>`;
}

const ornament = () =>
  `<div class="ornament"><span class="bar"></span>${star(13, 'var(--teal)')}<span class="bar"></span></div>`;

const ico = {
  face: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg>',
  check: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  blur: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.6"><circle cx="12" cy="12" r="9" stroke-dasharray="2 3"/><circle cx="12" cy="12" r="3.5"/></svg>',
  room: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a1 1 0 0 1 .8-1l8-1.6A1 1 0 0 1 14 3.4V21M14 21h6V9h-6M4 21h16"/><circle cx="11" cy="12" r=".9" fill="var(--teal)" stroke="none"/></svg>',
  family: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="2.6"/><circle cx="17" cy="9" r="2.1"/><path d="M3 19c0-2.8 2.2-5 5-5s5 2.2 5 5M15 19c0-2.2 1.3-4 3-4s3 1.8 3 4"/></svg>',
  back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  shield: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.4-2.9 8.3-7 10-4.1-1.7-7-5.6-7-10V6l7-3Z"/></svg>',
  send: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12 4 5l2.5 7L4 19l16-7Z"/></svg>',
  clock: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  done: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--verified)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
  pending: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.6"><circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/></svg>',

const screensEl = document.getElementById('screens');
const tabsEl = document.getElementById('tabs');
const noteEl = document.getElementById('screennote');
const viewport = document.getElementById('viewport');

screensEl.innerHTML = SCREENS.map(s => s.html.replace('<div class="screen', `<div id="s-${s.id}" class="screen`)).join('');

tabsEl.innerHTML = SCREENS.map((s, i) => `
  <button class="tab" role="tab" data-id="${s.id}" aria-selected="${i === 0}">${s.tab}</button>`).join('');

function show(id) {
  SCREENS.forEach(s => {
    const el = document.getElementById(`s-${s.id}`);
    if (el) el.dataset.active = String(s.id === id);
  });
  tabsEl.querySelectorAll('.tab').forEach(t =>
    t.setAttribute('aria-selected', String(t.dataset.id === id)));
  noteEl.textContent = SCREENS.find(s => s.id === id).note;
  viewport.scrollTop = 0;
  try { localStorage.setItem('nasib.screen', id); } catch (e) { /* private window */ }
}

tabsEl.addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (t) show(t.dataset.id);
});

// The chips are live so the form screen feels like a form, not a picture.
screensEl.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  chip.parentElement.querySelectorAll('.chip')
    .forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
});

let saved = null;
try { saved = localStorage.getItem('nasib.screen'); } catch (e) { /* ignore */ }
show(SCREENS.some(s => s.id === saved) ? saved : SCREENS[0].id);

const btn = document.getElementById('themebtn');
function currentlyDark() {
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t === 'dark';
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function syncLabel() { btn.textContent = currentlyDark() ? 'الوضع الفاتح' : 'الوضع الداكن'; }
btn.addEventListener('click', () => {
  document.documentElement.setAttribute('data-theme', currentlyDark() ? 'light' : 'dark');
  syncLabel();
});
syncLabel();
</script>
